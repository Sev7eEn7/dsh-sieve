packages:
  - packages/*
allowBuilds:
  # Test-only, via dsh-session-persistence-jsonl. Prebuilt binaries cover
  # macOS and Linux; the install script stays off unless a platform needs it.
  koffi: false
# pnpm's minimum-release-age policy blocks packages younger than its window;
# these pinned DSH alpha releases are exempt by exact version.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.5-alpha.1'
  - '@deepseek-ai/cosmokit@1.8.6-alpha.1'
  - '@deepseek-ai/dsh-agent@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-brand@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-llm@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-ptc-runtime@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-sandbox-policy@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-sandbox@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-scope@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-session-projection@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-session@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-system-prompt@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-timeout@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-tools@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-typert-protocol@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-user-approval@0.2.1-alpha.1'
  - '@deepseek-ai/dsh-util-crypto@0.2.1-alpha.1'
